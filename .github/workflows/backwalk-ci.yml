name: backwalk CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  format:
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        os: [ ubuntu-latest, ubuntu-24.04-arm ]

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install dependencies
      run: ./tools/install-deps.sh

    - name: Run clang-format
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_COMMIT=${{ github.event.pull_request.base.sha }}
            THIS_COMMIT=${{ github.event.pull_request.head.sha }}
            git clang-format-19 --diff $BASE_COMMIT $THIS_COMMIT
        else
            git clang-format-19 --diff HEAD^
        fi

  lint:
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        os: [ ubuntu-latest, ubuntu-24.04-arm ]

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: ./tools/install-deps.sh

    - name: Generate build system
      run: cmake -B ${{github.workspace}}/build

    - name: Run clang-tidy
      run: cmake --build ${{github.workspace}}/build -t lint

  headers:
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        os: [ ubuntu-latest, ubuntu-24.04-arm ]

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: ./tools/install-deps.sh

    - name: Generate build system
      run: cmake -B ${{github.workspace}}/build -DBW_IWYU=ON

    - name: Run iwyu
      run: cmake --build ${{github.workspace}}/build -t iwyu

  build:
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        os: [ ubuntu-latest, ubuntu-24.04-arm ]
        compiler:
          - { name: gcc-latest, c: gcc, cxx: g++ }
          - { name: gcc-11, c: gcc-11, cxx: g++-11 }
          - { name: clang-19, c: clang-19, cxx: clang++-19 }
        build_type:
          - { name: debug, flags: -DCMAKE_BUILD_TYPE=Debug -DBW_DEBUG_ENABLED=ON }
          - { name: release, flags: -DCMAKE_BUILD_TYPE=Release }

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: ./tools/install-deps.sh

    - name: Generate build system
      run: >
        cmake -B ${{github.workspace}}/build
        -DCMAKE_C_COMPILER=${{ matrix.compiler.c }}
        -DCMAKE_CXX_COMPILER=${{ matrix.compiler.cxx }}
        ${{ matrix.build_type.flags }}

    - name: Build
      run: cmake --build ${{github.workspace}}/build

    - name: Run unit tests
      run: ctest --test-dir ${{github.workspace}}/build -V

  sanitizers:
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        os: [ ubuntu-latest, ubuntu-24.04-arm ]
        compiler: 
          - { name: gcc-latest, c: gcc, cxx: g++ }
          - { name: gcc-11, c: gcc-11, cxx: g++-11 }
          - { name: clang-19, c: clang-19, cxx: clang++-19 }
        build_type:
          - { name: asan, flags: -DBW_ENABLE_ASAN=ON -DCMAKE_BUILD_TYPE=Debug }
          - { name: ubsan, flags: -DBW_ENABLE_UBSAN=ON -DCMAKE_BUILD_TYPE=Debug }
          - { name: msan, flags: -DBW_ENABLE_MSAN=ON -DCMAKE_BUILD_TYPE=Debug }
          - { name: tsan, flags: -DBW_ENABLE_TSAN=ON -DCMAKE_BUILD_TYPE=Debug }
        exclude:
          - compiler:
              name: gcc-11
            build_type:
              name: msan
          - compiler:
              name: gcc-latest
            build_type:
              name: msan
          - compiler:
              name: gcc-latest
            build_type:
              name: tsan
            os: ubuntu-24.04-arm

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: ./tools/install-deps.sh

    - name: Generate build system
      run: >
        cmake -B ${{github.workspace}}/build
        -DCMAKE_C_COMPILER=${{ matrix.compiler.c }}
        -DCMAKE_CXX_COMPILER=${{ matrix.compiler.cxx }}
        ${{ matrix.build_type.flags }}

    - name: Build
      run: cmake --build ${{github.workspace}}/build

    - name: Reduce ASLR entropy # https://github.com/google/sanitizers/issues/1716
      run: sudo sysctl vm.mmap_rnd_bits=28

    - name: Run unit tests
      run: ctest --test-dir ${{github.workspace}}/build -V

  build-result:
    needs: [build, windows, windows-sanitizers]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate build results
        run: |
          if [ "${{ needs.build.result }}" = "success" ] && [ "${{ needs.windows.result }}" = "success" ] && [ "${{ needs.windows-sanitizers.result }}" = "success" ]; then
            echo "All build steps succeeded"
            exit 0
          else
            echo "build=${{ needs.build.result }} windows=${{ needs.windows.result }} windows-sanitizers=${{ needs.windows-sanitizers.result }}"
            exit 1
          fi

  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [msvc, clang-cl, clang]
        config: [Debug, RelWithDebInfo]
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Add VS LLVM to PATH
        if: matrix.compiler != 'msvc'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $clang = & $vswhere -latest -products * -find "VC\Tools\Llvm\x64\bin\clang.exe" | Select-Object -First 1
          if (-not $clang) {
            $fallback = Join-Path ${env:ProgramFiles} "LLVM\bin\clang.exe"
            if (Test-Path $fallback) { $clang = $fallback }
          }
          if (-not $clang) { throw "clang.exe not found" }
          $bin = Split-Path $clang
          Add-Content -Path $env:GITHUB_PATH -Value $bin
          Write-Host "LLVM bin: $bin"

      - name: Configure
        shell: cmd
        run: |
          set ARGS=-B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          if "${{ matrix.compiler }}"=="clang-cl" set ARGS=%ARGS% -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl
          if "${{ matrix.compiler }}"=="clang" set ARGS=%ARGS% -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          cmake %ARGS%

      - name: Build
        shell: cmd
        run: cmake --build build

      - name: Test
        shell: cmd
        run: ctest --test-dir build --output-on-failure

  windows-sanitizers:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: msvc
            sanitizer: asan
            flags: -DBW_ENABLE_ASAN=ON
          - compiler: clang
            sanitizer: asan
            flags: -DBW_ENABLE_ASAN=ON
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Add VS LLVM to PATH
        if: matrix.compiler != 'msvc'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $clang = & $vswhere -latest -products * -find "VC\Tools\Llvm\x64\bin\clang.exe" | Select-Object -First 1
          if (-not $clang) {
            $fallback = Join-Path ${env:ProgramFiles} "LLVM\bin\clang.exe"
            if (Test-Path $fallback) { $clang = $fallback }
          }
          if (-not $clang) { throw "clang.exe not found" }
          $bin = Split-Path $clang
          Add-Content -Path $env:GITHUB_PATH -Value $bin
          Write-Host "LLVM bin: $bin"

      - name: Configure
        shell: cmd
        run: |
          set ARGS=-B build -G Ninja -DCMAKE_BUILD_TYPE=Debug ${{ matrix.flags }}
          if "${{ matrix.compiler }}"=="clang-cl" set ARGS=%ARGS% -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl
          if "${{ matrix.compiler }}"=="clang" set ARGS=%ARGS% -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          cmake %ARGS%

      - name: Build
        shell: cmd
        run: cmake --build build

      - name: Test
        shell: cmd
        run: ctest --test-dir build --output-on-failure
